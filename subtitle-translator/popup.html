<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Subtitle Translator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0f0f1a;
      color: #e8e8f0;
      overflow: hidden;
    }

    .header {
      padding: 16px 18px 12px;
      background: linear-gradient(135deg, rgba(108, 92, 231, 0.15), rgba(0, 206, 201, 0.1));
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 700;
    }

    .logo-icon {
      font-size: 20px;
    }

    .logo span {
      background: linear-gradient(135deg, #6c5ce7, #00cec9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .version {
      font-size: 10px;
      color: #55556a;
      margin-top: 2px;
      font-weight: 400;
      -webkit-text-fill-color: #55556a;
      background: none;
    }

    .body {
      padding: 16px 18px;
    }

    /* Toggle Button */
    .toggle-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .toggle-label {
      font-size: 14px;
      font-weight: 600;
    }

    .toggle-status {
      font-size: 11px;
      color: #55556a;
    }

    .toggle-status.on {
      color: #00cec9;
    }

    .toggle {
      position: relative;
      width: 48px;
      height: 26px;
      cursor: pointer;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      inset: 0;
      background: #2a2a3d;
      border-radius: 13px;
      transition: 0.3s;
    }

    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      left: 3px;
      bottom: 3px;
      background: #666;
      border-radius: 50%;
      transition: 0.3s;
    }

    .toggle input:checked+.toggle-slider {
      background: linear-gradient(135deg, #6c5ce7, #00cec9);
    }

    .toggle input:checked+.toggle-slider::before {
      transform: translateX(22px);
      background: white;
    }

    /* Settings */
    .settings {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .setting-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .setting-label {
      font-size: 11px;
      font-weight: 600;
      color: #7a7a95;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .select-wrap {
      position: relative;
    }

    select {
      width: 100%;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      color: #e8e8f0;
      font-size: 13px;
      font-family: inherit;
      appearance: none;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }

    select:hover,
    select:focus {
      border-color: rgba(108, 92, 231, 0.4);
    }

    .select-wrap::after {
      content: '▼';
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 9px;
      color: #55556a;
      pointer-events: none;
    }

    option {
      background: #1a1a2e;
      color: #e8e8f0;
    }

    /* Checkbox */
    .checkbox-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .checkbox-wrap:hover {
      border-color: rgba(108, 92, 231, 0.4);
    }

    .checkbox-wrap input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #6c5ce7;
      cursor: pointer;
    }

    .checkbox-wrap label {
      font-size: 13px;
      cursor: pointer;
      flex: 1;
    }

    /* Size buttons */
    .size-btns {
      display: flex;
      gap: 6px;
    }

    .size-btn {
      flex: 1;
      padding: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      color: #7a7a95;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .size-btn:hover {
      border-color: rgba(108, 92, 231, 0.3);
      color: #e8e8f0;
    }

    .size-btn.active {
      background: rgba(108, 92, 231, 0.15);
      border-color: rgba(108, 92, 231, 0.4);
      color: #a78bfa;
    }

    /* Footer */
    .footer {
      padding: 12px 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      text-align: center;
    }

    .footer-note {
      font-size: 10px;
      color: #44445a;
      line-height: 1.4;
    }

    .footer-note a {
      color: #6c5ce7;
      text-decoration: none;
    }

    /* YouTube required note */
    .yt-note {
      padding: 10px 14px;
      background: rgba(255, 193, 7, 0.08);
      border: 1px solid rgba(255, 193, 7, 0.15);
      border-radius: 8px;
      margin-bottom: 14px;
      font-size: 11px;
      color: #bba044;
      line-height: 1.5;
      display: none;
    }

    .yt-note.show {
      display: block;
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="logo">
      <span class="logo-icon">🌐</span>
      <div>
        <span>Live Subtitle Translator</span>
        <div class="version">v1.0 — Real-time translation</div>
      </div>
    </div>
  </div>

  <div class="body">
    <div class="yt-note" id="ytNote">
      ⚠️ Open a <strong>YouTube video</strong> first, then toggle the translator on.
    </div>

    <div class="toggle-section">
      <div>
        <div class="toggle-label">Translator</div>
        <div class="toggle-status" id="toggleStatus">OFF</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="toggleSwitch">
        <div class="toggle-slider"></div>
      </label>
    </div>

    <div class="settings">
      <div class="setting-group">
        <div class="setting-label">Translate To</div>
        <div class="select-wrap">
          <select id="targetLang">
            <option value="en" selected>🇬🇧 English</option>
            <option value="hi">🇮🇳 Hindi</option>
            <option value="es">🇪🇸 Spanish</option>
            <option value="fr">🇫🇷 French</option>
            <option value="de">🇩🇪 German</option>
            <option value="ja">🇯🇵 Japanese</option>
            <option value="ko">🇰🇷 Korean</option>
            <option value="zh-CN">🇨🇳 Chinese</option>
            <option value="ar">🇸🇦 Arabic</option>
            <option value="pt">🇧🇷 Portuguese</option>
            <option value="ru">🇷🇺 Russian</option>
            <option value="it">🇮🇹 Italian</option>
          </select>
        </div>
      </div>

      <div class="setting-group">
        <div class="setting-label">Subtitle Size</div>
        <div class="size-btns">
          <button class="size-btn" data-size="small">S</button>
          <button class="size-btn active" data-size="medium">M</button>
          <button class="size-btn" data-size="large">L</button>
        </div>
      </div>

      <div class="setting-group">
        <div class="checkbox-wrap">
          <input type="checkbox" id="showOriginal" checked>
          <label for="showOriginal">Show original text below</label>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-note">
      Works on YouTube • Auto-enables captions<br>
      Built by <a href="https://github.com/Neerajkorangaa" target="_blank">Neeraj Koranga</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
